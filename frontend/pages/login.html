<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes" />
    <title>Login — ShopFlow</title>
    <meta name="description" content="Login to your ShopFlow account - Owner or Staff" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/login.css" />
</head>
<body>
    <div class="login-container">
        <!-- Header -->
        <div class="login-header">
            <a href="../index.html" class="back-link">← Back</a>
            <a href="#" class="brand"><span class="dot"></span>ShopFlow</a>
            <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode">🌙</button>
        </div>

        <!-- Login Box -->
        <div class="login-box">
            <div class="login-top">
                <h1>Welcome Back</h1>
                <p class="sub">Login to manage your shop or start selling</p>
            </div>

            <!-- Role Toggle -->
            <div class="role-toggle" id="roleToggle">
                <button class="role-btn active" data-role="owner" id="ownerRoleBtn">
                    <span>👔</span> Shop Owner
                </button>
                <button class="role-btn" data-role="staff" id="staffRoleBtn">
                    <span>👤</span> Staff
                </button>
            </div>

            <!-- Owner Login Form -->
            <form id="ownerLoginForm" class="login-form active">
                <div class="form-group">
                    <label>Shop Name <span class="required">*</span></label>
                    <input type="text" id="ownerShopName" placeholder="Enter your shop name" required />
                </div>
                <div class="form-group">
                    <label>Owner Phone Number <span class="required">*</span></label>
                    <input type="tel" id="ownerPhone" placeholder="+254 7XX XXX XXX" required />
                </div>
                <div class="form-group">
                    <label>Password <span class="required">*</span></label>
                    <div class="password-wrapper">
                        <input type="password" id="ownerPassword" placeholder="Enter your password" required />
                        <button type="button" class="toggle-password" aria-label="Toggle password visibility">👁️</button>
                    </div>
                </div>
                <div class="form-options">
                    <label class="remember-me">
                        <input type="checkbox" id="rememberMe" /> Remember me
                    </label>
                    <a href="#" class="forgot-password">Forgot password?</a>
                </div>
                <button type="submit" class="btn btn-primary btn-full">Login as Owner →</button>
            </form>

            <!-- Staff Login Form -->
            <form id="staffLoginForm" class="login-form">
                <div class="form-group">
                    <label>Shop Name <span class="required">*</span></label>
                    <input type="text" id="staffShopName" placeholder="Enter shop name" required />
                </div>
                <div class="form-group">
                    <label>Staff ID / Email <span class="required">*</span></label>
                    <input type="text" id="staffId" placeholder="Enter your staff ID or email" required />
                </div>
                <div class="form-group">
                    <label>PIN / Password <span class="required">*</span></label>
                    <div class="password-wrapper">
                        <input type="password" id="staffPassword" placeholder="Enter your PIN or password" required />
                        <button type="button" class="toggle-password" aria-label="Toggle password visibility">👁️</button>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary btn-full">Login as Staff →</button>
            </form>

            <!-- Divider -->
            <div class="divider">
                <span>Don't have an account?</span>
            </div>

            <!-- Register Link -->
            <a href="register.html" class="btn btn-green btn-full">Register Your Shop</a>

            <!-- Demo Credentials -->
            <div class="demo-credentials">
                <p>🔑 <strong>Demo Credentials</strong></p>
                <div class="demo-grid">
                    <div class="demo-item">
                        <span class="demo-label">Owner:</span>
                        <span class="demo-value">Shop: Amani Perfumes</span>
                        <span class="demo-value">Phone: +254 712 345 678</span>
                        <span class="demo-value">Password: admin123</span>
                    </div>
                    <div class="demo-item">
                        <span class="demo-label">Staff:</span>
                        <span class="demo-value">Shop: Amani Perfumes</span>
                        <span class="demo-value">Staff ID: STAFF001</span>
                        <span class="demo-value">PIN: 1234</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/login.js"></script>
</body>
</html>
